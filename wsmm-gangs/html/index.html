<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WSMM GANGS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="rtl">
  <div id="toast" hidden></div>

  <div id="summon" class="banner" hidden>
    <div>
      <strong id="summon-title"></strong>
      <div id="summon-sub"></div>
    </div>
    <div class="row">
      <button id="summon-ok" class="btn"></button>
      <button id="summon-no"></button>
    </div>
  </div>

  <div id="tablet" class="shell" hidden>
    <section class="main">
      <header class="top">
        <div class="brand"><span class="skull">☠</span> WSMM GANGS</div>
        <div class="page-title" id="page-title"></div>
        <div class="top-tools">
          <input class="search hidden" id="search" placeholder=""/>
          <button id="btn-lang" class="ghost"></button>
          <button id="btn-close" class="ghost">✕</button>
        </div>
      </header>
      <div class="content" id="page"></div>
    </section>
    <aside class="side">
      <div class="side-pane" id="side-pane">
        <nav id="nav"></nav>
      </div>
      <div class="side-rail" id="side-rail">
        <button type="button" class="rail-btn" id="rail-up" aria-label="up">▲</button>
        <div class="rail-track" id="rail-track"><div class="rail-thumb" id="rail-thumb"></div></div>
        <button type="button" class="rail-btn" id="rail-down" aria-label="down">▼</button>
      </div>
    </aside>
  </div>

  <div id="spray" hidden>
    <div class="spray-box">
      <div class="brand"><span class="skull">☠</span> WSMM GANGS</div>
      <div class="row">
        <button id="mode-free" class="btn"></button>
        <button id="mode-text"></button>
      </div>
      <canvas id="cv" width="420" height="260"></canvas>
      <input id="spray-text" maxlength="28" hidden/>
      <div class="row">
        <button id="spray-ok" class="btn"></button>
        <button id="spray-cancel"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
